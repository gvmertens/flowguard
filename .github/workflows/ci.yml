name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Lint
        run: mvn -B checkstyle:check
      - name: Tests
        run: mvn -B test
      - name: Package validation
        run: mvn -B -DskipTests package

