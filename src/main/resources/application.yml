spring:
  application:
    name: flowguard
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${FLOWGUARD_MODEL:gpt-4.1-mini}

flowguard:
  ai:
    enabled: ${FLOWGUARD_AI_ENABLED:false}
  github:
    api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    token: ${GITHUB_TOKEN:}
  low-code:
    webhook-url: ${LOW_CODE_WEBHOOK_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

